services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buildra
      POSTGRES_USER: buildra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildra_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buildra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildra -d buildra"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  buildra_postgres:
